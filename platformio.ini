; Jandy Aqualink RS -> ESP32 bridge
; Emulates an "All Button" RS keypad on the Jandy RS-485 bus and exposes
; panel state over REST + WebSocket + MQTT.

[platformio]
default_envs = waveshare_s3_rs485

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-RS485-CAN industrial control board.
; ESP32-S3-WROOM-1, 16MB flash, isolated RS485 on GPIO 17/18/21.
; ---------------------------------------------------------------------------
[env:waveshare_s3_rs485]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D ASYNCWEBSERVER_REGEX=1
    ; Keep AsyncTCP off core 1 so it never competes with the RS-485 task.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    ; Some Waveshare ESP32-S3 boards expose a direct USB CDC path instead of a
    ; CH343 UART bridge. Enable this for those boards so Serial output appears.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2

; Notes on this board:
;
; * USB is a CH343P UART bridge, not native USB. Serial output works with no
;   extra flags -- do NOT set ARDUINO_USB_CDC_ON_BOOT, it will break the
;   monitor. Install CH343 drivers if the port does not enumerate.
;
; * The module is an ESP32-S3R8 (8MB octal PSRAM). PSRAM is left DISABLED
;   because nothing here needs it and a wrong memory_type setting causes boot
;   crashes. If you ever want it: board_build.arduino.memory_type = qio_opi.
;
; * If upload fails: hold BOOT, tap RESET, release RESET, release BOOT.

; ---------------------------------------------------------------------------
; Plain ESP32 devkit with an external RS485 transceiver. Kept working as a
; fallback -- adjust the pins and JANDY_PIN_DE in include/config.h to match.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D ASYNCWEBSERVER_REGEX=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2

; Use a WROOM module, not WROVER -- WROVER uses GPIO16/17 for PSRAM and you
; would silently lose the UART pins.

; ---------------------------------------------------------------------------
; Native test environment. Builds lib/jandy_codec on the host with no Arduino,
; no ESP32, no hardware. Run:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity
lib_compat_mode = off
lib_deps =
build_src_filter = -<*>
