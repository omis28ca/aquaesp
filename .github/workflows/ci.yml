name: CI

on: [push, pull_request]

jobs:
  test:
    name: Codec unit tests + firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      # The codec has no hardware dependencies, so this runs anywhere.
      # It must stay green -- it is the only automated check in the repo.
      - name: Codec unit tests
        run: pio test -e native
      - name: Build firmware
        run: pio run -e esp32dev
